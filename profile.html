<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="icon" type="image/png" href="asset/favicon.png">

    <link rel="stylesheet" href="css/profile.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>

<body>
<script>
    /* Apply dark mode before render to avoid flicker */
    if (localStorage.getItem("darkMode") === "true") {
        document.body.classList.add("dark");
    }
</script>

<div class="app">

    <aside class="sidebar">

        <div class="sidebar-brand">
            <img src="asset/logo.png" alt="TaskFlow logo" class="sidebar-logo">
            <h2>TaskFlow</h2>
        </div>

        <nav>

            <a href="dashboard.html">
                <i data-lucide="house"></i>
                <span>Home</span>
            </a>

            <a href="task.html">
                <i data-lucide="check-square"></i>
                <span>Tasks</span>
            </a>

            <a href="analytics.html">
                <i data-lucide="bar-chart-3"></i>
                <span>Analytics</span>
            </a>

            <a href="calendar.html">
                <i data-lucide="calendar-days"></i>
                <span>Calendar</span>
            </a>

            <a href="profile.html" class="active">
                <i data-lucide="user"></i>
                <span>Profile</span>
            </a>

        </nav>

    </aside>


    <section class="profile-page">

        <h2>Profile</h2>

        <div class="profile-card">

            <!-- ── TOP: avatar + name ── -->
            <div class="profile-top">

                <div class="profile-circle" id="profile-circle">
                    <img src="asset/lady.png" id="profile-img" alt="Profile photo">
                    <div class="camera-icon">
                        <i class='bx bx-camera'></i>
                    </div>
                </div>

                <input type="file" id="profile-upload" accept="image/*">

                <div class="user-info">
                    <h3 id="username">Your Name</h3>
                    <p id="email">your@email.com</p>
                    <button id="edit-profile">Edit Profile</button>
                </div>

            </div>


            <!-- ── TASK STATS ── -->
            <div id="main-content">
                <div class="dashboard">
                    <div class="box">
                        <p>Total</p>
                        <span id="total-count">0</span>
                    </div>
                    <div class="box">
                        <p>Pending</p>
                        <span id="pending-count">0</span>
                    </div>
                    <div class="box">
                        <p>Completed</p>
                        <span id="completed-count">0</span>
                    </div>
                </div>
            </div>


            <!-- ── SETTINGS ── -->
            <div class="settings-panel">

                <div class="setting-item">
                    <i class='bx bx-shield'></i>
                    <span>My Focus</span>
                    <select id="focus">
                        <option>Study</option>
                        <option>Work</option>
                        <option>Finance</option>
                        <option>Personal</option>
                    </select>
                </div>

                <div class="setting-item">
                    <i class='bx bx-moon'></i>
                    <span>Dark Mode</span>
                    <label class="switch">
                        <input type="checkbox" id="dark-toggle">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="setting-item">
                    <i class='bx bx-alarm'></i>
                    <span>Reminders</span>
                    <label class="switch">
                        <input type="checkbox">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="setting-item">
                    <i class='bx bx-bell'></i>
                    <span>Notifications</span>
                    <i class='bx bx-chevron-right'></i>
                </div>

                <div class="setting-item">
                    <i class='bx bx-cog'></i>
                    <span>Settings</span>
                    <i class='bx bx-chevron-right'></i>
                </div>

                <div class="setting-item">
                    <i class='bx bx-help-circle'></i>
                    <span>Help &amp; Support</span>
                    <i class='bx bx-chevron-right'></i>
                </div>

            </div>

            <button class="logout-btn" id="logout">Log Out</button>

        </div><!-- /.profile-card -->

    </section>

</div><!-- /.app -->


<div class="bottom-nav">

    <a href="dashboard.html" class="nav-item">
        <i data-lucide="house"></i>
        <span>Home</span>
    </a>

    <a href="task.html" class="nav-item">
        <i data-lucide="check-square"></i>
        <span>Tasks</span>
    </a>

    <a href="analytics.html" class="nav-item">
        <i data-lucide="bar-chart-3"></i>
        <span>Analytics</span>
    </a>

    <a href="calendar.html" class="nav-item">
        <i data-lucide="calendar-days"></i>
        <span>Calendar</span>
    </a>

    <a href="profile.html" class="nav-item active">
        <i data-lucide="user"></i>
        <span>Profile</span>
    </a>

</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script>lucide.createIcons();</script>
<script src="profile.js"></script>
<script src="task.js"></script>

</body>
</html>
